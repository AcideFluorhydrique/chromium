name: Release Chromium

# Check weekly for the latest Android Stable version; if this repo doesn't have
# a corresponding GitHub Release yet, run the relay build and publish a Release.
# Stable has minor releases almost every week, and a single build takes about
# 12 hours, so build at most once per week.
# Signed with the public debug key built into the Chromium source code, package
# name org.chromium.chrome (same as uazo's Vanilla Chromium), allowing direct
# in-place updates for every release.

on:
  schedule:
    - cron: "17 2 * * 4"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even if a Release for the same version already exists (will overwrite existing files)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-chromium
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.v.outputs.build }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force || false }}
        run: |
          version=$(curl -fsSL "https://chromiumdash.appspot.com/fetch_releases?channel=Stable&platform=Android&num=1" | jq -r '.[0].version')
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version format: '$version'"; exit 1
          fi
          echo "Latest Android Stable: $version"
          newest=$(gh release list -R "$GITHUB_REPOSITORY" --limit 100 --json tagName -q '.[].tagName' \
            | sed 's/^v//' | sort -V | tail -1)
          build=true
          if [ "$FORCE" = "true" ]; then
            echo "force: Forcing rebuild"
          elif gh release view "v$version" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            build=false; echo "v$version already exists"
          elif [ -n "$newest" ] && [ "$(printf '%s\n%s\n' "$version" "$newest" | sort -V | tail -1)" != "$version" ]; then
            build=false; echo "Newer version v$newest already exists; skipping older version"
          fi
          echo "Should build: $build"
          {
            echo "version=$version"
            echo "build=$build"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    uses: ./.github/workflows/build-android.yml
    with:
      version: ${{ needs.check.outputs.version }}
      target_cpu: arm64
      package_name: org.chromium.chrome
      # is_official_build: APK is ~295MB (non-official is ~513MB); takes ~12 hours across 3 relay jobs either way
      official: true

  publish:
    needs: [check, build]
    runs-on: ubuntu-24.04
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: chromium-android-arm64-${{ needs.check.outputs.version }}
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          mkdir -p release
          cp "$(find dist -name '*.apk' | head -1)" "release/chromium-$VERSION-android-arm64.apk"
          ls -lh release
          tag="v$VERSION"
          notes=$(printf '%s\n' \
            "Built from unmodified Chromium $VERSION (Android Stable) source code." \
            "" \
            "- arm64, package name org.chromium.chrome" \
            "- Signed with the public debug key built into the Chromium source code (SHA-256 32a2fc74d731105859e5a85df16d95f102d85b22099b8064c5d8915c61dad1e0), allowing direct in-place updates for every release" \
            "" \
            "---" \
            "" \
            "Chromium $VERSION（Android Stable）原始碼編譯，未修改。" \
            "" \
            "- arm64，包名 org.chromium.chrome" \
            "- 用 Chromium 原始碼內建的公開 debug 金鑰簽名（SHA-256 32a2fc74d731105859e5a85df16d95f102d85b22099b8064c5d8915c61dad1e0），每一版都能直接覆蓋更新")
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" release/* --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" release/* -R "$GITHUB_REPOSITORY" \
              --title "Chromium $VERSION" --notes "$notes" --target ci
          fi
